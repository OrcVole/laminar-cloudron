; Laminar — four supervised processes, each logging to stdout/stderr (Cloudron captures these).
; start.sh does setup (ownership, secrets, CLOUDRON_* -> Laminar env) then exec's supervisord.
; ClickHouse + Quickwit start immediately; the app-server/frontend wrappers gate on readiness so the
; frontend's on-boot Postgres + ClickHouse migrations run against ready stores (field-guide gotcha 37/39).

[program:clickhouse]
command=/usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
user=cloudron
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:quickwit]
; QW_DATA_DIR + QW_LISTEN_ADDRESS (127.0.0.1) are exported by start.sh; binds localhost only.
command=/usr/bin/quickwit run
user=cloudron
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app-server]
command=/app/code/conf/run-app-server.sh
directory=/app/code/app-server
user=cloudron
autostart=true
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/app/code/conf/run-frontend.sh
directory=/app/code/frontend
user=cloudron
autostart=true
autorestart=true
priority=30
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
